name: Core regression verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run ten complete negative-first sweeps
        run: python -B .github/skills/finops-cost-evidence/tests/run_tests.py --offline-only --repeat 10 --seed 4701 --coverage
      - name: Exercise real local CLI processes with synthetic evidence
        if: success()
        run: python -B .github/skills/finops-cost-evidence/tests/run_local_integration.py
      - name: Preserve synthetic diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            .finops-runs/tests
            .finops-runs/local-integration
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  microsite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate only the public artifact
        run: python3 tools/validate_microsite.py
